slug: tomato-brandywine
common_names:
  - Brandywine tomato
  - Brandywine
scientific_name: Solanum lycopersicum 'Brandywine'
category: vegetable
lifecycle: annual
climate:
  usda_zones: [3, 4, 5, 6, 7, 8, 9, 10]
  frost_tolerance: none
sun: full
water: medium
soil:
  ph: [6.0, 6.8]
  drainage: well
spacing_cm: 90
days_to_maturity: [78, 90]
sowing:
  indoors_weeks_before_last_frost: 6
  direct_sow: false
  transplant_after_last_frost_weeks: 2
companions:
  good: [basil, carrot, marigold]
  bad: [brassicas, fennel]
common_issues:
  - early blight (Alternaria solani)
  - late blight (Phytophthora infestans)
  - blossom end rot (calcium uptake disorder driven by uneven watering)
  - cracking after heavy rain following dry spell
sources:
  - kind: extension
    title: Growing tomatoes in home gardens
    publisher: University of Minnesota Extension
    url: https://extension.umn.edu/vegetables/growing-tomatoes
  - kind: extension
    title: Tomato — Home & Garden Information Center
    publisher: Clemson Cooperative Extension
    url: https://hgic.clemson.edu/factsheet/tomato/
