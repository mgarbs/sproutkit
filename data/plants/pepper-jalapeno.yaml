slug: pepper-jalapeno
common_names:
  - Jalapeño pepper
  - Jalapeno
scientific_name: Capsicum annuum 'Jalapeño'
category: vegetable
lifecycle: annual
climate:
  usda_zones: [4, 5, 6, 7, 8, 9, 10, 11]
  frost_tolerance: none
sun: full
water: medium
soil:
  ph: [6.0, 6.8]
  drainage: well
spacing_cm: 45
days_to_maturity: [70, 85]
sowing:
  indoors_weeks_before_last_frost: 8
  direct_sow: false
  transplant_after_last_frost_weeks: 2
companions:
  good: [basil, tomato, carrot, onion]
  bad: [fennel]
common_issues:
  - blossom drop above ~32°C (90°F)
  - blossom end rot (calcium uptake disorder from inconsistent water)
  - aphids and pepper weevils
  - sunscald on exposed fruit
sources:
  - kind: extension
    title: Growing peppers in home gardens
    publisher: University of Minnesota Extension
    url: https://extension.umn.edu/vegetables/growing-peppers
  - kind: extension
    title: Pepper — Home & Garden Information Center
    publisher: Clemson Cooperative Extension
    url: https://hgic.clemson.edu/factsheet/pepper/
