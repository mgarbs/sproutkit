slug: zucchini-black-beauty
common_names:
  - Black Beauty zucchini
  - Black Beauty summer squash
scientific_name: Cucurbita pepo 'Black Beauty'
category: vegetable
lifecycle: annual
climate:
  usda_zones: [3, 4, 5, 6, 7, 8, 9, 10, 11]
  frost_tolerance: none
sun: full
water: high
soil:
  ph: [6.0, 7.5]
  drainage: well
spacing_cm: 90
days_to_maturity: [50, 65]
sowing:
  direct_sow: true
  indoors_weeks_before_last_frost: 3
  transplant_after_last_frost_weeks: 2
companions:
  good: [bean, corn, nasturtium, radish]
  bad: [potato]
common_issues:
  - squash vine borer (Melittia cucurbitae) at base of stem
  - squash bugs and cucumber beetles
  - powdery mildew on mature leaves
  - blossom end rot from inconsistent watering
sources:
  - kind: extension
    title: Growing summer squash and zucchini in home gardens
    publisher: University of Minnesota Extension
    url: https://extension.umn.edu/vegetables/growing-summer-squash-and-zucchini
  - kind: extension
    title: Cucumber, Squash, Melon & Other Cucurbits
    publisher: Clemson Cooperative Extension
    url: https://hgic.clemson.edu/factsheet/cucumber-squash-melon-other-cucurbits/
