notes: |
  Hardneck garlic for fall planting (4-6 weeks before ground freeze in cold
  zones). Music is a Porcelain-type — large cloves (4-7 per bulb), strong
  flavor, stores 6-9 months. Plant in well-drained soil with 4-6 inches of
  mulch. Replace SKU with a verified True Leaf Market product slug.
