  - spring-planting
notes: |
  Medium-weight spunbond polypropylene (~0.55 oz/yd², ~28 g/m²) offers ~4-8°F
  of frost protection and ~70-85% light transmission — the right balance for
  fall season extension. Heavier weights protect more but cost light; lighter
  weights are insect-barrier only. Replace ASIN with a verified product before
  going live.
