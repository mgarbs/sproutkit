slug: calcium-nitrate-fertilizer
name: Calcium nitrate fertilizer (15.5-0-0 + 19% Ca)
category: amendment
tags:
  - calcium-deficiency
  - tomato
  - pepper
  - solanaceae
  - fertilizer
  - soil-amendment
notes: |
  Water-soluble calcium nitrate provides both nitrogen and calcium in a form
  plants can take up quickly — useful for foliar feeding when blossom end rot
  symptoms appear and root uptake is the limiting factor. Note: blossom end
  rot is most often a water-uptake problem, not a soil-calcium deficiency, so
  pair this with even watering. Replace ASIN with a verified product before
  going live.
