notes: |
  Cedar resists rot 8-15 years without chemical treatment. 4'×8' is the
  canonical size — 4' wide so a gardener can reach the middle from either
  side without stepping in. 11"+ depth supports root crops and avoids the
  shallow-bed limitations of pre-cut "low" beds. Replace ASIN with a
  verified product before going live.
