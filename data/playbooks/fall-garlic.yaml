slug: fall-garlic
title: Plant Fall Garlic for Summer Bulbs
topic: fall garlic planting
category: plant
difficulty: beginner
time_estimate: 1-2 hours, plus spring care
tags: [allium, garlic, cool-season, frost-hardy, overwintering, fall-planting, mulch]
steps:
  - heading: Plant before the ground freezes
    body: |
      Plant garlic 4 to 6 weeks before the ground usually freezes so cloves can root without making excessive top growth. In many cold-winter gardens this falls in October, while mild areas may plant later when soil temperatures are below about 60 degrees F. Choose a full-sun bed with loose, well-drained soil and avoid allium ground used in the last 3 to 4 years.
  - heading: Break bulbs into cloves
    body: |
      Separate bulbs only 1 to 2 days before planting so cloves do not dry out. Keep the papery wrapper on each clove and discard soft, shriveled, moldy, or damaged cloves. Plant the largest outside cloves first because they usually produce the largest bulbs.
  - heading: Set cloves point up
    body: |
      Dig a furrow about 4 to 5 inches deep and set each clove with the flat basal plate down and the pointed tip up. Cover cloves with 2 to 3 inches of soil above the tip, or set the clove base about 3 to 4 inches below the surface. Space cloves 6 inches apart in double rows, with 12 inches between paired rows and at least 18 inches between beds or paths. Firm the soil with your palm, then water once to settle soil around the cloves.
  - heading: Mulch after planting
    body: |
      Apply 3 to 4 inches of clean straw or shredded leaves after planting to reduce frost heaving and winter temperature swings. In spring, pull thick mulch back from emerging shoots if the soil is staying cold and wet, then return it between rows for weed control. Provide about 1 inch of water per week during active spring growth and stop watering about 2 weeks before harvest.
  - heading: Remove scapes and harvest bulbs
    body: |
      For hardneck garlic, cut scapes when they curl once, usually in late spring or early summer. Harvest when the lower leaves have browned and about half of the upper leaves are still green, often late June through July depending on climate. Lift bulbs with a fork rather than pulling hard on the stem. Cure whole plants in airy shade for 2 to 4 weeks, then trim roots and cut stems about 1 inch above the bulb.
