slug: season-extension
title: Extend Harvests with Row Cover and Low Tunnels
topic: extending growing season frost cover
category: season-extension
difficulty: intermediate
time_estimate: 1-2 hours to install, plus venting checks
tags: [cool-season, frost-hardy, fall-planting, spring-planting, hoop-house, kale, lettuce, leafy-green]
steps:
  - heading: Cover crops before frost
    body: |
      Install row cover over cool-season crops when night forecasts start reaching 34 to 36 degrees F, not after plants are already frozen. Water the bed before covering because moist soil stores more heat than dry soil. Use covers over greens from planting through harvest, but remove them from flowering cucumbers, squash, melons, and beans so pollinators can reach blossoms. For fall crops, start with strong transplants or direct seed early enough that plants are nearly harvest size before hard freezes arrive.
  - heading: Bend a low tunnel frame
    body: |
      For a 30 to 36 inch wide bed, bend 10 ft lengths of EMT conduit, PVC conduit, or heavy wire into hoops 18 to 30 inches tall. Place hoops every 3 to 5 ft down the row and push each leg 6 to 8 inches into the soil, or slide the legs over short rebar stakes. Keep the cover at least 6 inches above kale or lettuce leaves so fabric does not abrade foliage in wind. Add a ridge line or twine along the hoop tops when the site is exposed.
  - heading: Choose the fabric weight
    body: |
      Lightweight row cover transmits more than 90 percent of available light and is best for insect exclusion with little frost protection. Medium-weight cover transmits about 75 to 85 percent of light and is the best general choice for light frosts on lettuce, spinach, and kale. Heavyweight cover can protect plants near 20 degrees F for short events, but it may block 40 to 50 percent of sunlight. Use heavyweight fabric for 1 to 3 cold nights, then switch back or vent when sun returns.
  - heading: Anchor and vent the cover
    body: |
      Drape fabric with 12 to 18 inches of extra material along both edges. Seal edges with soil, boards, bricks, or sandbags every 3 to 4 ft so wind cannot lift the cover. Clip fabric to hoops and gather the tunnel ends around a stake or sandbag. On sunny days, open ends or lift one side when the tunnel interior reaches about 75 degrees F to reduce heat and humidity.
  - heading: Match crops to the tunnel
    body: |
      Prioritize frost-hardy leafy greens such as kale, spinach, and lettuce because they tolerate cold better than fruiting crops. Transplant fall kale about 6 to 8 weeks before the first expected frost and keep plants 12 to 18 inches apart under the cover. Harvest outer leaves regularly so the canopy stays below the tunnel and air can move through the crop.
recommended_products: [frost-cloth-row-cover, kale-lacinato-seeds]
related_plant_slugs: [kale-lacinato, lettuce-buttercrunch]
