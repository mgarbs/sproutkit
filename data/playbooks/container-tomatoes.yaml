slug: container-tomatoes
title: Grow Indeterminate Tomatoes in 15-Gallon Containers
topic: container tomatoes
category: plant
difficulty: intermediate
time_estimate: 45-60 minutes to plant, then daily checks
tags: [solanaceae, tomato, warm-season, frost-tender, container, transplant, cage, calcium-deficiency, fertilizer, drip-irrigation]
steps:
  - heading: Select one large draining container
    body: |
      Use one 15-gallon container per indeterminate tomato, with a minimum diameter of 18 inches and at least five 1/2 inch drainage holes. Place the container where the plant gets 6 to 8 hours of direct sun and morning air movement. Set the pot in its final spot before filling because wet mix, water, cage, and plant can weigh more than 100 pounds. Keep the container off sealed pavement when possible so reflected heat does not push root-zone temperatures above 85 degrees F.
  - heading: Fill with fresh potting mix
    body: |
      Use a fresh, peat- or coir-based soilless potting mix rather than garden soil, which compacts in containers. For a 15-gallon pot, blend up to 3 gallons of finished compost into 12 gallons of potting mix if the mix is not already heavily amended. Transplant after frost danger has passed, nights are staying above 50 degrees F, and the mix is near 60 degrees F. Remove the lowest leaves and bury the stem so the root ball and several inches of stem are below the final soil line.
  - heading: Water before stress shows
    body: |
      Keep moisture even because container tomatoes dry faster than in-ground plants. In hot or windy weather, check once every morning and water until excess drains from the bottom. Let the top 1 inch begin to dry before watering again, but do not let the full root ball pull away from the pot wall. Use a drip ring or water at the soil surface so leaves are not wet overnight.
  - heading: Prevent blossom-end rot
    body: |
      Blossom-end rot is tied to calcium movement in the fruit and is often triggered by uneven moisture. Mulch the pot surface with 1 to 2 inches of straw or shredded leaves to slow drying. If the fertilizer program calls for calcium nitrate, apply it only at the label rate and avoid pushing excessive nitrogen growth. Remove damaged fruit early so the plant puts energy into healthy fruit that sets later.
  - heading: Cage and prune the vine
    body: |
      Install a 5 to 6 ft tomato cage or stake at transplanting, before roots fill the container. Tie the main stem every 8 to 12 inches with soft ties as the plant climbs. For a vigorous indeterminate tomato in a pot, keep 1 or 2 main stems and pinch extra suckers while they are under 4 inches long. Remove yellowing lower leaves once they are within 6 to 8 inches of the potting mix.
recommended_products: [tomato-brandywine-seeds, calcium-nitrate-fertilizer]
related_plant_slugs: [tomato-brandywine]
